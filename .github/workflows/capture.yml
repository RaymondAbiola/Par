name: capture premium history

on:
  schedule:
    # github throttles scheduled runs hard on shared runners and honours roughly one
    # trigger every few hours, so each run captures repeatedly instead of once
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      init_schema:
        description: "Create tables before capturing"
        type: boolean
        default: false
      once:
        description: "Capture a single snapshot and exit"
        type: boolean
        default: false

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # a single run covers ~3.5h, which closes most of the gap between triggers
    timeout-minutes: 240
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Initialise schema
        if: inputs.init_schema
        run: npm run db:init

      - name: Capture on a loop
        run: |
          ITERATIONS=${{ inputs.once && '1' || '14' }}
          for i in $(seq 1 "$ITERATIONS"); do
            echo "--- snapshot $i of $ITERATIONS ---"
            # one bad snapshot should not end the run; the next is 15 minutes away
            npm run capture || echo "capture $i failed, continuing"
            if [ "$i" -lt "$ITERATIONS" ]; then sleep 900; fi
          done

      - name: Coverage
        if: always()
        run: npm run check:db
