name: capture premium history

on:
  schedule:
    # asks for every 15 minutes, but github heavily throttles scheduled runs on free
    # runners and in practice honours roughly one in fifteen. odd minutes are less contended.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      init_schema:
        description: "Create tables before capturing"
        type: boolean
        default: false

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Initialise schema
        if: inputs.init_schema
        run: npm run db:init

      - name: Capture snapshot
        run: npm run capture

      - name: Coverage
        run: npm run check:db
